<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom English — Miss Melanie</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <style>
    :root {
      --bg: #f4efe6;
      --surface: #fffaf3;
      --fg: #1f1a16;
      --muted: #6b635b;
      --primary: #3d5c4e;
      --primary-fg: #f4efe6;
      --border: #d8d0c4;
      --good: #2f6b4f;
      --good-bg: #e4f0e8;
      --bad: #9b3d32;
      --bad-bg: #f6e4e0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
    body { background-image: radial-gradient(1200px 500px at 10% -10%, color-mix(in oklab, var(--primary) 8%, transparent), transparent 60%); }
    button:not(:disabled) { cursor: pointer; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 8rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .kicker { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); }
    h1 { margin: .15rem 0 0; font-family: Fraunces, "Times New Roman", serif; font-size: 1.75rem; font-weight: 600; }
    .back { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 600; }
    .pill { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: .4rem .85rem; font-size: .9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
    h2 { font-family: Fraunces, serif; font-size: 1.85rem; margin: 0; }
    .muted { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 1rem 0; align-items: center; }
    .btn { height: 2.75rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 1rem; font-weight: 600; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); height: 3rem; font-size: 1rem; }
    .btn:disabled { opacity: .4; cursor: default; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
    .topic { overflow: hidden; border-radius: 20px; border: 1px solid var(--border); background: color-mix(in oklab, var(--surface) 70%, transparent); text-align: left; padding: 0; width: 100%; }
    .topic.on { border-color: var(--primary); background: var(--surface); }
    .topic img { width: 100%; height: 7.5rem; object-fit: cover; display: block; }
    .topic .meta { padding: .75rem; }
    .topic .meta strong { display: block; }
    .topic .meta span { display: block; font-size: 12px; color: var(--muted); }
    .dock { position: fixed; inset: auto 0 0 0; border-top: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 95%, transparent); backdrop-filter: blur(8px); padding: .75rem 1rem; }
    .dock-inner { max-width: 72rem; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
    input[type=number] { height: 2.75rem; width: 5rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 .75rem; font-size: 1rem; }
    .play { max-width: 48rem; margin: 0 auto; }
    .bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 1.25rem; }
    .bar > div { height: 100%; background: var(--primary); }
    .card { overflow: hidden; border-radius: 28px; border: 1px solid var(--border); background: var(--surface); }
    .photo { position: relative; aspect-ratio: 4/3; background: #ebe4d8; }
    .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .photo .pulse { position: absolute; inset: 0; background: #e3d9cc; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    .body { padding: 1.25rem 1.4rem 1.6rem; }
    .sentence { font-family: Fraunces, serif; font-size: 1.6rem; line-height: 1.3; margin: 0 0 1.25rem; }
    .blank { display: inline-block; min-width: 6rem; border-bottom: 2px solid var(--primary); color: var(--primary); text-align: center; padding: 0 .25rem; }
    .blank.good { border-color: var(--good); color: var(--good); }
    .blank.bad { border-color: var(--bad); color: var(--bad); }
    .choices { display: grid; gap: 10px; }
    @media (min-width: 640px) { .choices { grid-template-columns: 1fr 1fr; } .sentence { font-size: 1.85rem; } }
    .choice { min-height: 3rem; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-weight: 600; font-size: 1rem; text-transform: capitalize; }
    .choice:hover:not(:disabled) { border-color: var(--primary); background: var(--surface); }
    .choice.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
    .choice.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
    .choice.dim { color: var(--muted); }
    .feedback { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-top: 1rem; }
    .ok { color: var(--good); font-weight: 600; }
    .no { color: var(--bad); font-weight: 600; }
    .summary { max-width: 48rem; margin: 0 auto; border-radius: 28px; border: 1px solid var(--border); background: var(--surface); padding: 2rem; }
    .miss { list-style: none; padding: 0; margin: 1rem 0 0; }
    .miss li { border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: .75rem 1rem; margin-bottom: .5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 1.75rem; }
    .actions .btn, .actions .btn-primary { flex: 1; min-width: 10rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <a class="back" href="tools.html">← Learning tools</a>
        <p class="kicker">Ages 5–16</p>
        <h1>Bloom English</h1>
      </div>
      <div id="counter" class="pill" hidden></div>
    </header>
    <div id="app">Loading cards…</div>
  </main>
  <script>
    const MEDIA = "https://cdn.jsdelivr.net/gh/EkstremBoy/bloom-english@main/public";
    const CATALOG_URLS = [
      "https://cdn.jsdelivr.net/gh/EkstremBoy/bloom-english@main/public/catalog.json",
      "https://raw.githubusercontent.com/EkstremBoy/bloom-english/main/public/catalog.json",
    ];

    const $ = (sel, el = document) => el.querySelector(sel);
    const app = $("#app");
    const counter = $("#counter");

    let CATEGORIES = [];
    let CARDS = [];
    let selected = new Set();
    let count = 10;
    let phase = "home";
    let deck = [];
    let index = 0;
    let answers = [];
    let picked = null;
    let choices = [];
    let photoReady = false;

    function shuffle(items) {
      const next = items.slice();
      for (let i = next.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function media(path) { return MEDIA + path; }

    function available() {
      return CARDS.filter((c) => selected.has(c.category)).length;
    }

    function pickDeck(n) {
      const pool = shuffle(CARDS.filter((c) => selected.has(c.category)));
      return pool.slice(0, Math.min(Math.max(1, n), pool.length));
    }

    function shuffleChoices(card) {
      return shuffle([card.word, ...card.distractors]);
    }

    function preload(i) {
      for (let k = i; k < i + 3 && k < deck.length; k++) {
        const img = new Image();
        img.src = media(deck[k].image);
      }
    }

    async function loadCatalog() {
      let lastErr;
      for (const url of CATALOG_URLS) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error(res.status);
          return await res.json();
        } catch (err) { lastErr = err; }
      }
      throw lastErr || new Error("catalog");
    }

    function render() {
      if (phase === "home") return renderHome();
      if (phase === "play") return renderPlay();
      return renderSummary();
    }

    function renderHome() {
      counter.hidden = true;
      const n = Math.min(Math.max(1, count), Math.max(1, available()));
      const can = selected.size > 0 && available() > 0;
      app.innerHTML = `
        <h2>Choose your topics</h2>
        <p class="muted">Twenty sets of 25 Boom Cards for kids 5 to 16. Tick the topics you want, pick how many cards to play, then start.</p>
        <div class="row">
          <button class="btn" type="button" id="all">Select all</button>
          <button class="btn" type="button" id="none">Clear</button>
          <span class="muted">${selected.size} topics · ${available()} cards ready</span>
        </div>
        <div class="grid" id="topics"></div>
        <div class="dock"><div class="dock-inner">
          <label>Number of cards
            <input type="number" min="1" max="${Math.max(1, available())}" value="${count}">
            <span class="muted">default 10 · max ${available()}</span>
          </label>
          <button class="btn-primary" id="start" ${can ? "" : "disabled"}>Start ${can ? n : 0} cards</button>
        </div></div>`;
      const topics = $("#topics");
      CATEGORIES.forEach((cat) => {
        const on = selected.has(cat.id);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "topic" + (on ? " on" : "");
        b.innerHTML = `<img alt="" src="${media(cat.image)}"><div class="meta"><strong>${cat.name}</strong><span>${cat.blurb}</span></div>`;
        b.onclick = () => {
          if (selected.has(cat.id)) selected.delete(cat.id);
          else selected.add(cat.id);
          renderHome();
        };
        topics.appendChild(b);
      });
      $("#all").onclick = () => { selected = new Set(CATEGORIES.map((c) => c.id)); renderHome(); };
      $("#none").onclick = () => { selected = new Set(); renderHome(); };
      $("input[type=number]").onchange = (e) => { count = Number(e.target.value) || 1; renderHome(); };
      $("#start").onclick = () => {
        deck = pickDeck(Math.min(Math.max(1, count), available()));
        if (!deck.length) return;
        phase = "play"; index = 0; answers = []; picked = null;
        choices = shuffleChoices(deck[0]);
        photoReady = false;
        preload(0);
        renderPlay();
      };
    }

    function showPhoto(card) {
      photoReady = false;
      const img = new Image();
      img.onload = () => {
        if (deck[index] && deck[index].id === card.id) {
          photoReady = true;
          const slot = $(".photo");
          if (slot) {
            slot.innerHTML = `<img alt="${card.word}" data-word="${card.word}" src="${media(card.image)}">`;
          }
        }
      };
      img.src = media(card.image);
    }

    function renderPlay() {
      const card = deck[index];
      counter.hidden = false;
      counter.textContent = `${index + 1} / ${deck.length}`;
      const locked = picked !== null;
      const isCorrect = picked === card.word;
      const pct = Math.round(((index + (picked ? 1 : 0)) / deck.length) * 100);
      const blankClass = !picked ? "blank" : isCorrect ? "blank good" : "blank bad";
      app.innerHTML = `
        <div class="play">
          <div class="bar"><div style="width:${pct}%"></div></div>
          <div class="card">
            <div class="photo" id="photo">${photoReady ? `<img alt="${card.word}" data-word="${card.word}" src="${media(card.image)}">` : `<div class="pulse"></div>`}</div>
            <div class="body">
              <p class="sentence">${card.before} <span class="${blankClass}">${picked ? picked : "&nbsp;"}</span> ${card.after}</p>
              <div class="choices" id="choices"></div>
              <div id="after"></div>
            </div>
          </div>
        </div>`;
      const box = $("#choices");
      choices.forEach((choice) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.textContent = choice;
        b.disabled = locked;
        if (locked) {
          if (choice === card.word) b.classList.add("right");
          else if (choice === picked) b.classList.add("wrong");
          else b.classList.add("dim");
        }
        b.onclick = () => {
          if (picked) return;
          picked = choice;
          answers.push({ cardId: card.id, choice, correct: choice === card.word });
          renderPlay();
        };
        box.appendChild(b);
      });
      if (picked) {
        $("#after").innerHTML = `
          <div class="feedback">
            <p class="${isCorrect ? "ok" : "no"}">${isCorrect ? "Correct." : `The word is “${card.word}”.`} <span class="muted">${card.hint}</span></p>
            <button class="btn-primary" id="next">${index === deck.length - 1 ? "See summary" : "Next card"}</button>
          </div>`;
        $("#next").onclick = () => {
          if (index >= deck.length - 1) { phase = "summary"; renderSummary(); return; }
          index += 1;
          picked = null;
          choices = shuffleChoices(deck[index]);
          photoReady = false;
          preload(index);
          renderPlay();
          showPhoto(deck[index]);
        };
      }
      if (!photoReady) showPhoto(card);
    }

    function renderSummary() {
      counter.hidden = true;
      const correctCount = answers.filter((a) => a.correct).length;
      const missed = answers.filter((a) => !a.correct).map((a) => CARDS.find((c) => c.id === a.cardId)).filter(Boolean);
      const percent = Math.round((correctCount / deck.length) * 100);
      const ratio = correctCount / deck.length;
      const headline = ratio === 1 ? "Perfect set." : ratio >= 0.8 ? "Strong work." : ratio >= 0.5 ? "Good start — review the missed words." : "Let’s practise the missed words together.";
      app.innerHTML = `
        <div class="summary">
          <p class="kicker">Summary</p>
          <h2>${correctCount} / ${deck.length} correct</h2>
          <p class="muted">${percent}% — ${headline}</p>
          <div class="bar" style="margin-top:1.5rem"><div style="width:${percent}%"></div></div>
          ${missed.length ? `<h3 style="margin:2rem 0 0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase">Words to review</h3>
            <ul class="miss">${missed.map((c) => `<li><strong>${c.word}</strong><span class="muted">${c.before} ${c.word}${c.after}</span></li>`).join("")}</ul>` : `<p class="ok" style="margin-top:2rem">Every word is solid. Beautiful work.</p>`}
          <div class="actions">
            <button class="btn-primary" id="again">Play again</button>
            ${missed.length ? `<button class="btn" id="retry">Review missed words</button>` : ""}
            <button class="btn" id="home">Change topics</button>
          </div>
        </div>`;
      $("#again").onclick = () => { count = deck.length; $("#start") && 0; deck = pickDeck(deck.length); phase="play"; index=0; answers=[]; picked=null; choices=shuffleChoices(deck[0]); photoReady=false; preload(0); renderPlay(); };
      const retry = $("#retry");
      if (retry) retry.onclick = () => { deck = missed.length ? missed : deck; phase="play"; index=0; answers=[]; picked=null; choices=shuffleChoices(deck[0]); photoReady=false; preload(0); renderPlay(); };
      $("#home").onclick = () => { phase = "home"; renderHome(); };
    }

    loadCatalog().then((data) => {
      CATEGORIES = data.categories;
      CARDS = data.cards;
      selected = new Set(CATEGORIES.map((c) => c.id));
      renderHome();
    }).catch(() => {
      app.innerHTML = "<p>Could not load the card catalog. Check the connection and try again.</p>";
    });
  </script>
</body>
</html>
